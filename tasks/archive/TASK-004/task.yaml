duplicate_of:
  task_id: "TASK-003"
  canonical: "TASK-004"
  reason: >
    Both tasks were created from the same request. TASK-003 was blocked because the product agent
    could not write at the time (Cursor cached the pre-fix agent definitions in which product was
    readonly). Its requirements.json was then authored directly by the human as a workaround.
    TASK-004 was created by a later /spec run in a session where the correction had taken effect, and
    its requirements were written by product through the normal stage.
  resolution: >
    TASK-004 is canonical: its requirements came from the product role rather than from a human
    workaround, and its only defect is unresolved product decisions, which the answers above resolve.
    TASK-003 was superseded and later removed from the repository so demo tasks do not linger under
    active/ or archive/ after the duplicate was resolved.
  superseded_artifact: "TASK-003/requirements.json (removed from repository)"
  retained_for: "The hashed-token, atomic-consume, and uniform-error constraints in TASK-003's design assumptions are carried into derived_technical_constraints above."
  framework_gap: >
    Nothing in the pipeline detects that two active tasks describe the same request. The artifact
    invariants check a task against its own plan; they do not compare tasks to each other. The
    orchestrator noticed informally but recorded nothing. A duplicate-request check at intake is a
    candidate addition: compare the new request against active task titles and requirements before
    allocating a task ID.

