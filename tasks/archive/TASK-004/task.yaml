# developer run commands in an unconfirmed environment, and the investigation that followed
# surfaced both a machine-level finding and a hard structural blocker.
# ---------------------------------------------------------------------------

environment:
  status: "BLOCKED"
  confirmed_by_user: false
  detected:
    conda_environments:
      - "base (Python 3.13.9) — currently active; `CONDA_DEFAULT_ENV` is empty"
      - "package"
      - "tool"
      - "torch"
      - "vi (Python 3.12.13)"
    node: "v24.15.0"
    npm: "11.12.1"
    nvm: "not installed"
    product_stack: "none found — no package.json, lockfile, src/, pages/, db/, or tests/"
  findings:
    - id: "ENV-3"
      severity: "medium"
      description: >
        `conda env list` reports the environment named `vi` TWICE, both entries pointing at the same
        environment directory.
      impact: >
        A duplicated name makes "use the vi environment" ambiguous as an instruction: two entries
        can disagree about which interpreter or package set a command resolves to. This is exactly
        the class of problem the environment gate exists to catch, because the resulting failure
        would look like a code defect.
      resolution: >
        `conda run -n vi python` was used successfully and reported Python 3.12.13, so the exact
        invocation is recorded rather than the bare name. The duplicate registration itself is a
        machine configuration issue for the human to clean up.
      resolved: false

# ENV-1 and ENV-2 above are the blocking items the orchestrator recorded while the gate was open.
# STRUCT-1 below is the structural half of ENV-2, stated as its own concern because it has its own
# owner and its own mechanical check.

structural_blocker:
  id: "STRUCT-1"
  severity: "blocking"
  description: >
    The approved design and plan describe a codebase that is not this repository. Plan step 6 says
    `modify` on `src/organizations/routes.ts`, which does not exist. The design assumes an existing
    organization service, an organization-role guard, a membership service, a mail transport port,
    a shared error shape, and a transaction helper — none of which are here.
  owner: "tech-lead"
  why_it_blocks: >
    Implementing this plan here would require first inventing the entire surrounding service. That is
    a silent redesign and a scope expansion far past the nine planned files, and it is precisely what
    the developer agent refused to do when it paused.
  mechanical_detection: >
    No longer a matter of an agent reasoning it out by hand. `check_plan_against_repository` reports
    `step_target_missing` whenever a `modify` or `delete` step targets a file that is absent, so the
    mismatch is now stated as a fact before any work starts:
      python .agent/tools/validate.py --task TASK-004 --stage plan   -> FAIL, 1 error
  resolution_options:
    - "Run the task in the repository the design actually assumes, re-running /spec there so the intake, design and plan describe real files. This is the intended path: the framework is built to be copied into a product repository."
    - "Re-run /design against a repository that does have the assumed service, so the plan is written for code that exists."
    - "Deliberately greenfield: accept that the surrounding service must also be built, and re-scope the task to say so explicitly rather than smuggling it in."
  not_an_option: >
    Implementing anyway. That produces an implementation of an imagined service, which every
    downstream gate would then verify against a design describing a different codebase.

