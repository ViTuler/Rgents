# ---------------------------------------------------------------------------
# Product decisions — the human's answers to the 8 open questions.
# Status: ANSWERED and FOLDED IN. requirements.json now carries them as
# AC-1..AC-14, BR-1..BR-10 and 14 edge cases, with open_questions set to [].
# These answers are the source of truth; the requirements file is their rendering.
# ---------------------------------------------------------------------------

product_decisions:
  answered_by: "human"
  answered_at: "2026-09-20"

  Q1_who_may_invite:
    decision: "Owner and admin only. A regular member cannot invite."
    rationale: "Membership grants access to organization data, so the right to create membership must match the right to manage membership."
    affects: ["BR-3", "AC-6", "unauthorized edge case"]

  Q2_colleague_identifier:
    decision: "Email address, supplied by the inviting user."
    rationale: "It is the only identifier that reaches someone who may not have an account yet, and it is what a delivery channel needs."
    affects: ["AC-1", "AC-3", "personal data retained"]
    note: "Stored as an invitation attribute and personal data. Subject to the retention question below."

  Q3_expiry:
    decision: "Yes. Valid for 7 days from creation. After expiry the invitation can no longer be accepted and is refused identically to an unknown invitation."
    rationale: "Bounds how long a leaked invitation stays useful, without making a normal working week too short."
    affects: ["BR-2", "expired edge case"]
    note: "7 days is a chosen default, not a measured optimum. It is cheap to change while the invitation lifetime is a single constant."

  Q4_role_on_join:
    decision: "Regular member. No elevated role is granted by an invitation."
    rationale: "Least privilege. Granting admin through an invitation would let a mistaken or malicious invite escalate access silently."
    affects: ["AC-2", "membership outcome"]
    note: "This task does not include changing a member's role afterwards; that is out of scope."

  Q5_delivery_and_acceptance:
    decision: "Delivered by email containing a link. The colleague must accept explicitly; a successful invitation does NOT add them directly."
    rationale: "Joining must require a deliberate action by the person being added. Consent matters, and it prevents anyone from adding a colleague without their knowledge."
    affects: ["delivery path", "accept rule"]
    constraint_derived: >
      Fetching the link must NOT consume the invitation. Mail clients, link scanners and chat
      previews fetch URLs automatically, so a GET that accepts would let a preview consume the
      invitation before the colleague ever opens it. Reading the invitation is a safe GET; accepting
      is a separate deliberate action.

  Q6_account_required:
    decision: "The colleague does not need an existing account. Someone not yet registered may be invited."
    rationale: "Requiring a pre-existing account would rule out the primary case: bringing a new colleague in."
    affects: ["who can be invited"]
    note: "The invitation is bound to the email address. If the colleague already has an account, acceptance links the membership to that account. If they do not, acceptance is preceded by account creation."
    constraint_derived: >
      Binding to the email address means the invitation is not transferable. A signed-in user whose
      address differs from the invited address must not be able to consume it as themselves.

  Q7_duplicate_and_already_member:
    decision: >
      Already a member: refuse, and do not create a second membership.
      Already-outstanding invitation for the same organization and address: replace the outstanding
      invitation with the new one, so exactly one invitation is ever outstanding.
    rationale: "Refusing duplicates bounds what a leaked invitation can do, and keeps acceptance unambiguous. Replacing rather than rejecting means an admin can recover from a lost email without a special resend feature, which is out of scope."
    affects: ["duplicate edge case", "already-member edge case", "BR-4"]

  Q8_target_organization:
    decision: "The inviting user acts within one organization context, and that context is confirmed in the invitation request. Authorization is always evaluated server-side against that specific organization."
    rationale: "The authority to invite is per organization, so the target must be explicit rather than inferred from the caller."
    affects: ["AC-1", "AC-5", "target organization selection"]
    constraint_derived: >
      A caller who holds a role in more than one organization must not be able to create an invitation
      for an organization in which they hold no role. The path or payload organization identifier is
      the authority checked, never the caller's default or most recent organization.

  derived_technical_constraints:
    description: >
      These follow from the decisions above and from security requirements, not from product intent.
      They constrain the design; they do not add scope.
    items:
      - "The invitation token is a credential. Store only a hash; the plaintext exists only in the email and the accept request."
      - "Consuming an invitation must be atomic, so a single invitation cannot be accepted twice under concurrency."
      - "Every non-acceptable invitation state (unknown, malformed, expired, already accepted) must return an indistinguishable response, so the endpoint is not an oracle for which invitations exist."

